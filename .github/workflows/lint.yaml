name: Lint

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install ruff==0.14.9

      - name: Run Ruff
        id: ruff
        run: |
          set -o pipefail
          ruff check .
